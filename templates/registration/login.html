{% extends "base.html" %}
{% block title %}Log in | Northstar Store{% endblock %}
{% block content %}<section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><form method="post">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button button-dark full-button" type="submit">Log in →</button></form><p>New here? <a href="{% url 'store:signup' %}">Create an account</a></p></section>{% endblock %}
